
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jisot Internet Free</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #061a14;
      color: #f3f4f6;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
      background: #0d281f;
      border: 1px solid #10b981;
      border-radius: 14px;
      box-shadow: 0 10px 30px #10b98122;
    }
    h1 { color: #f59e0b; }
    p { color: #d1d5db; line-height: 1.5; }
    .sponsor {
      margin: 24px 0;
      padding: 20px;
      border: 2px dashed #f59e0b;
      border-radius: 8px;
      background: #11382b;
    }
    label {
      display: block;
      margin-bottom: 8px;
      text-align: left;
      color: #10b981;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input {
      margin-bottom: 15px;
      color: white;
      background: #061a14;
      border: 1px solid #10b981;
    }
    button {
      border: none;
      background: #f59e0b;
      color: #061a14;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Jisot Internet</h1>
    <p>Get your daily free internet access sponsored by our partners.</p>

    <section class="sponsor">
      <h3>📢 Sponsor Update</h3>
      <p>Support local creators to help keep free connection running in Kenya!</p>
    </section>

    <form id="claim-form">
      <label for="phone">Phone Number (M-Pesa / Contact)</label>
      <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        autocomplete="tel"
        required
      >
      <button id="claim-button" type="submit">Claim Free Internet</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const API_URL = 'https://jisot-internet-free.onrender.com';
    const form = document.getElementById('claim-form');
    const message = document.getElementById('message');
    const button = document.getElementById('claim-button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const phoneNumber = document.getElementById('phone').value.trim();
      button.disabled = true;
      message.style.color = '#f59e0b';
      message.textContent = 'Connecting to server...';

      try {
        const response = await fetch(`${API_URL}/api/claim-access`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber })
        });

        const result = await response.json();

        message.style.color = response.ok && result.success
          ? '#10b981' : '#ef4444';
        message.textContent = result.message ||
          (response.ok ? 'Request completed.' : 'Request failed.');
        
        if (response.ok && result.success) form.reset();
      } catch (error) {
        message.style.color = '#ef4444';
        message.textContent =
          'Could not connect. Please check the server and try again.';
        console.error('API request failed:', error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
