
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06291e">
  <title>Jisot Internet - Free Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #03180f;
      color: #f5f7f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 38px 28px;
      text-align: center;
      background: #0b3024;
      border: 2px solid #20b889;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(20, 185, 130, 0.12);
    }

    h1 {
      margin: 8px 0 22px;
      color: #ffa500;
      font-size: clamp(34px, 8vw, 48px);
    }

    .intro {
      margin: 0 0 38px;
      color: #d2ded8;
      font-size: 21px;
      line-height: 1.5;
    }

    .sponsor {
      margin-bottom: 42px;
      padding: 28px 18px;
      border: 3px dashed #f5a623;
      border-radius: 17px;
    }

    .sponsor h2 {
      margin: 10px 0 20px;
      font-size: 27px;
    }

    .sponsor p {
      margin: 0;
      color: #d5e0da;
      font-size: 19px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 16px;
      color: #20c997;
      text-align: left;
      font-size: 21px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 65px;
      padding: 16px;
      border: 2px solid #27c99b;
      border-radius: 12px;
      background: #f0f4ff;
      color: #18221e;
      font-size: 20px;
      outline-offset: 3px;
    }

    button {
      width: 100%;
      min-height: 68px;
      margin-top: 26px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #ffa500;
      color: #172117;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      display: none;
      margin: 24px 0 0;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #103f2d;
      color: #5ff0b7;
    }

    #message.error {
      display: block;
      background: #421f24;
      color: #ff9299;
    }

    #message.info {
      display: block;
      background: #173b43;
      color: #a9eaff;
    }

    .footer {
      margin-top: 28px;
      color: #9eb8ac;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .container {
        padding: 30px 19px;
      }

      .sponsor {
        padding: 22px 13px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Jisot Internet</h1>

    <p class="intro">
      Get your daily free internet access sponsored by our partners.
    </p>

    <section class="sponsor">
      <h2>📢 Sponsor Update</h2>
      <p>
        Support local creators to help keep free connection
        running in Kenya!
      </p>
    </section>

    <form id="claimForm">
      <label for="phoneNumber">Phone Number (M-Pesa / Contact)</label>

      <input
        type="tel"
        id="phoneNumber"
        name="phoneNumber"
        placeholder="e.g. 07XXXXXXXX"
        autocomplete="tel"
        inputmode="tel"
        maxlength="20"
        required
      >

      <button type="submit" id="claimButton">
        Claim Free Internet
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="footer">
      Jisot Internet · Free access sponsored by our partners
    </p>
  </main>

  <script>
    // Your live Render backend URL.
    const API_URL = 'https://jisot-internet-free.onrender.com';

    const form = document.getElementById('claimForm');
    const phoneInput = document.getElementById('phoneNumber');
    const button = document.getElementById('claimButton');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const phoneNumber = phoneInput.value.trim();

      if (!phoneNumber) {
        showMessage('Please enter your phone number.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Connecting...';

      showMessage(
        'Connecting to Jisot Internet. The first request may take a little longer.',
        'info'
      );

      try {
        const response = await fetch(
          `${API_URL}/api/claim-access`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ phoneNumber })
          }
        );

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            `The server returned an unexpected response (HTTP ${response.status}).`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.message || `Request failed (HTTP ${response.status}).`
          );
        }

        if (data.success) {
          showMessage(
            data.message || 'Your request was received successfully.',
            'success'
          );
          form.reset();
        } else {
          showMessage(
            data.message || 'Your request could not be completed.',
            'error'
          );
        }
      } catch (error) {
        console.error('Jisot claim request failed:', error);

        if (error instanceof TypeError) {
          showMessage(
            'Could not reach the server. Check the Render CORS settings and try again. If the server is waking up, wait a minute and retry.',
            'error'
          );
        } else {
          showMessage(
            error.message || 'Something went wrong. Please try again.',
            'error'
          );
        }
      } finally {
        button.disabled = false;
        button.textContent = 'Claim Free Internet';
      }
    });
  </script>
</body>
</html>
